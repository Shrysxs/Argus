name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/web/prisma/schema.prisma
      - run: npx turbo typecheck
      - run: npx turbo lint
      - name: Package unit tests
        run: npx turbo test --filter=@argus/*

  web:
    name: Web integration tests & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://argus:argus@localhost:5432/argus_test
      DIRECT_URL: postgresql://argus:argus@localhost:5432/argus_test
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        working-directory: apps/web
        run: npx prisma migrate deploy --schema prisma/schema.prisma
      - name: Check schema matches migrations
        working-directory: apps/web
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Integration tests
        working-directory: apps/web
        run: npm test
      - name: Production build
        working-directory: apps/web
        run: npm run build

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
